name: CI

# Corre em cada Pull Request e em cada push para a main.
# Se algum job falhar, o PR fica vermelho (e não deve ser feito merge).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java + JaCoCo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Compilar, testar e verificar cobertura (quality gate)
        run: mvn -B verify

      - name: Guardar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco/

  frontend:
    name: Frontend (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Análise estática (ESLint)
        run: npm run lint

      - name: Verificar tipos (TypeScript)
        run: npm run typecheck

      - name: Testes e cobertura (quality gate de 80%)
        run: npm run coverage

      - name: Build da PWA
        run: npm run build

      - name: Auditoria de dependências (falha com vulnerabilidades High/Critical)
        run: npm audit --audit-level=high

      - name: Guardar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage/

  ia:
    name: Assistente de IA (Python, RAG)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ia
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ia/requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Análise estática (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Testes, anti-alucinação e cobertura (quality gate de 80%)
        run: pytest

      - name: Auditoria de dependências (pip-audit)
        run: pip-audit -r requirements.txt

  segredos:
    name: Segredos no histórico Git (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo, não só o último commit

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
